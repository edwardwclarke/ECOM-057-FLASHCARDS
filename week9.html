<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Week 9 - Growth Investing Flashcards</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9fafb;
      color: #1f2937;
    }

    h1 {
      text-align: center;
      padding-top: 2rem;
      font-size: 2rem;
      font-weight: 600;
    }

    .home-link {
      text-align: center;
      margin-top: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .home-link a {
      text-decoration: none;
      color: #2563eb;
      font-weight: 500;
      font-size: 0.95rem;
      border: 1px solid #2563eb;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      transition: all 0.2s ease-in-out;
    }

    .home-link a:hover {
      background-color: #2563eb;
      color: white;
    }

    .flashcard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      perspective: 1000px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 180px;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      cursor: pointer;
      border-radius: 1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      background-color: #fff;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      border-radius: 1rem;
      box-sizing: border-box;
    }

    .card-front {
      background-color: #e0f2fe;
      font-weight: 600;
    }

    .card-back {
      background-color: #fef3c7;
      transform: rotateY(180deg);
    }
  </style>
</head>
<body>

<h1>Week 9 – Growth Investing Flashcards</h1>
<div class="home-link">
  <a href="/index.html">Return to Home</a>
</div>

<div class="flashcard-grid">

  <!-- FLASHCARDS GO HERE (same as before) -->

</div>

</body>
</html>
